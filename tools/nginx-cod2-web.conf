# CoD2 web client + game assets
# Prefer HTTPS: SharedArrayBuffer (WASMFS/pthreads) needs a secure context.
#   https://87.121.85.236/play/cod2.html

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Send browser to HTTPS for the web client (SAB / COOP+COEP)
    location /play/ {
        return 301 https://$host$request_uri;
    }

    location / {
        root /home/cod2server;
        autoindex off;
        sendfile on;
        tcp_nopush on;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cod2-web.crt;
    ssl_certificate_key /etc/nginx/ssl/cod2-web.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Required for SharedArrayBuffer / WASMFS+pthread
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    types {
        application/wasm wasm;
        application/javascript js;
        text/html html;
        application/json json;
        application/octet-stream iwd;
    }
    default_type application/octet-stream;

    location /play/ {
        alias /var/www/cod2-web/;
        index cod2.html;
        gzip off;
        # Avoid stale WASM/JS after deploys (black-screen from old build).
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # WebSocket ↔ UDP game relay for browser Join/connect. See tools/game_proxy/.
    # Must be before the catch-all /play/api/ masterlist location.
    location /play/api/gamews {
        proxy_pass http://127.0.0.1:20712/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # HTTP masterlist proxy for browser Join Game (no UDP). See tools/master_proxy/.
    location /play/api/ {
        proxy_pass http://127.0.0.1:20711/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # Trimmed MP-only pack for the web client (dedicated still uses /home/cod2server/main on disk).
    location /main/ {
        alias /var/www/cod2-assets/main/;
        gzip off;
        sendfile on;
        tcp_nopush on;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location / {
        root /home/cod2server;
        autoindex off;
        sendfile on;
        tcp_nopush on;
    }
}
